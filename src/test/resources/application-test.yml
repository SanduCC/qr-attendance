# Test profile. Postgres and Redis come from Testcontainers via @ServiceConnection,
# so no datasource / redis URLs are set here. All secrets below are dummies.
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

attendance:
  # The datasource comes from Testcontainers (@ServiceConnection), not spring.datasource.url.
  startup:
    warm-up-database: false
  public-base-url: http://localhost
  # Shared by all integration tests (one Spring context); only AdminTeachersTest signs in with it.
  admin-emails: "Head.Admin@university.example.ro"
  security:
    qr-hmac-secret: test-qr-hmac-secret-0123456789abcdef-0123456789
    hash-pepper: test-hash-pepper-0123456789abcdef-0123456789abc
    secure-cookies: true
  jobs:
    # Tests run the jobs themselves; a real-time timer racing them would make session status assertions flaky.
    in-app-schedule: false
    trigger:
      # Tokens are signed by a test key (support/JobTriggerTestTokens), not Google.
      service-account: job-trigger@test-project.iam.gserviceaccount.com

logging:
  level:
    org.testcontainers: INFO
    io.github.sanducc.attendance: DEBUG
