<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<main class="container">
    <div class="card center">
        <p class="status-code" th:text="${status} ?: 'Error'">500</p>
        <h1 th:switch="${status}">
            <th:block th:case="404">Page not found</th:block>
            <th:block th:case="403">You don't have access to this page</th:block>
            <th:block th:case="429">Too many attempts</th:block>
            <th:block th:case="*">Something went wrong</th:block>
        </h1>
        <p class="muted" th:if="${status == 429}">Please wait a minute and try again.</p>
        <p class="muted" th:unless="${status == 429}" th:text="${error}">Internal Server Error</p>
        <p><a class="btn btn-primary" th:href="@{/}">Go to home page</a></p>
    </div>
</main>
</body>
</html>
