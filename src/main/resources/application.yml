spring:
  application:
    name: qr-attendance
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/attendance}
    username: ${DATABASE_USERNAME:attendance}
    password: ${DATABASE_PASSWORD:attendance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      # Redis is used through RedisTemplate / Spring Session only. Without this, startup scans the JPA repositories
      # a second time as Redis repository candidates and logs a line for each of them.
      repositories:
        enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
  # Outgoing mail for the email sign-in codes (#52). Only used when attendance.email-sign-in.enabled is true; set
  # through env vars only. TLS is mandatory and enforced in code (EmailSignInConfiguration): port 465 = SMTPS
  # (implicit TLS), any other port = STARTTLS, required. Timeouts keep a slow SMTP server from hanging the page.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${PORT:8080}
  # Set to "framework" behind a TLS-terminating proxy (Cloud Run, Caddy, nginx). Leave "none" otherwise,
  # or clients could spoof X-Forwarded-For to dodge the per-IP rate limit. With "framework" the app installs
  # TrustedProxyForwardedHeaderFilter: Spring's ForwardedHeaderFilter for scheme/host/port, but the client IP is
  # the X-Forwarded-For entry the proxy appended (attendance.security.trusted-proxy-hops), never a client value.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      # HTTP sessions live in Redis (Spring Session, keys qra:session:sessions:<id>, see SessionConfig), so they
      # survive deploys and are shared by all instances. Cookie name: SESSION.
      timeout: 60m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  mime-mappings:
    webmanifest: application/manifest+json

management:
  health:
    # The SMTP server is not part of the app's health: a mail outage only affects email sign-in, and /actuator/health
    # must not open an SMTP connection (or fail when MAIL_HOST is unset).
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        # Boot 4 turns the liveness/readiness probes on everywhere (Boot 3: only on Kubernetes / Cloud Foundry), which
        # adds their state indicators and "groups" to /actuator/health. Cloud Run's probes and the deploy smoke test
        # use plain /actuator/health (database + Redis), so keep it as it was.
        enabled: false

attendance:
  startup:
    # Open one throwaway database connection in the background while Spring starts, so a suspended Neon compute
    # is already awake when Flyway needs the database (DatabaseWarmUp, #28).
    warm-up-database: true
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  display-zone: Europe/Bucharest
  # Comma-separated. Only admins can add/deactivate teachers (/admin/teachers); admins are teachers too.
  admin-emails: ${ADMIN_EMAILS:}
  security:
    qr-hmac-secret: ${QR_HMAC_SECRET}
    hash-pepper: ${HASH_PEPPER}
    secure-cookies: ${COOKIE_SECURE:true}
    # Only with FORWARD_HEADERS_STRATEGY=framework: how many proxies in front of the app append to
    # X-Forwarded-For. The client IP is that many entries from the right (#39). 1 = Cloud Run's run.app URL,
    # Caddy, nginx; 2 = behind an external Application Load Balancer; 0 = ignore the header (TCP peer).
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}
  session:
    default-duration: 15m
    max-duration: 3h
    # Time a student has between scanning and finishing sign-in + check-in.
    check-in-grace: 3m
  qr:
    window: 15s
  rate-limit:
    # A whole class often shares one NAT'd Wi-Fi IP, so the per-IP limit must cover a class.
    per-ip-per-minute: 120
    per-device-per-minute: 10
  email-sign-in:
    # "No Google account? Sign in with email" for students (#52): a 6-digit code is mailed and typed in the same
    # browser. Off unless mail is configured (MAIL_HOST, MAIL_FROM, ...); never grants the teacher or admin role.
    enabled: ${EMAIL_SIGN_IN_ENABLED:false}
    # Sender, e.g. "QR Attendance <attendance@example.ro>"; must be an address the SMTP provider has verified.
    from: ${MAIL_FROM:}
    code-validity: 10m
    max-attempts: 5
    # Minimum time between two codes for the same browser ("Send a new code").
    resend-cooldown: 30s
    # How long a request waits for the SMTP server before showing "couldn't send the code, try again".
    send-timeout: 10s
    limits:
      # Codes sent to one address. Stops mail-bombing a student and caps guesses per address (5 per code).
      sends-per-email-per-15-min: 3
      # Codes requested from one device cookie.
      sends-per-device-per-15-min: 5
      # Codes requested from one IP. A class shares one NAT'd Wi-Fi IP, so this covers a class.
      sends-per-ip-per-hour: 60
      # All codes, app-wide: stays under the free tier of the mail provider (e.g. Brevo: 300/day).
      sends-per-day: 250
      # Code entries (right or wrong) from one browser session, across resends.
      verifies-per-session-per-15-min: 10
      # Code entries from one IP (a class again).
      verifies-per-ip-per-15-min: 150
  geofence:
    # Optional "Require location" when starting a session (rule 6). Radius the teacher may pick, in metres.
    default-radius-m: 100
    min-radius-m: 25
    max-radius-m: 1000
    # A student passes when distance - min(reported accuracy, this) <= radius. Caps how far a phone's (claimed)
    # inaccuracy can stretch the fence.
    max-accuracy-credit-m: 100
  retention:
    academic-year-end: "09-30"
    grace-days: 30
    # In-app schedule of the purge (only when jobs.in-app-schedule is true), Europe/Bucharest.
    cron: "0 30 3 * * *"
  jobs:
    # In-app timers for the retention purge (cron above) and auto-close (every minute). Right for docker compose /
    # a VPS. On Cloud Run (scale to zero) set JOBS_IN_APP_SCHEDULE=false and let Cloud Scheduler call
    # POST /internal/jobs/daily (docs/deployment.md, "Scheduled jobs").
    in-app-schedule: ${JOBS_IN_APP_SCHEDULE:true}
    trigger:
      # The service account whose Google OIDC token may call POST /internal/jobs/daily. Empty = endpoint disabled.
      service-account: ${JOBS_TRIGGER_SERVICE_ACCOUNT:}
      # The token's exact audience. Empty = PUBLIC_BASE_URL + /internal/jobs/daily.
      audience: ${JOBS_TRIGGER_AUDIENCE:}
