name: CI

# Runs on every pull request and on pushes to master. A PR is merged only when all required jobs are green
# (enforced by branch protection and scripts/merge_pr.py, see CONTRIBUTING.md).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Branch is feature/, bugfix/ or hotfix/ (CONTRIBUTING.md)
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^(feature|bugfix|hotfix)/[a-z0-9][a-z0-9._-]*$ || "$BRANCH" == dependabot/* ]]; then
            echo "Branch name OK: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' must be feature/<slug>, bugfix/<slug> or hotfix/<slug> (lowercase a-z 0-9 . _ -)."
            exit 1
          fi

  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Amazon Corretto)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Docker is available on GitHub-hosted Ubuntu runners, so the Testcontainers
      # integration tests (Postgres 16 + Redis 7) run here instead of being skipped.
      - name: Build and verify
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build image (no push)
        run: docker build -t qr-attendance:ci .
